<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentador - Cultura Digital II</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            primary: '#3b82f6',
                            accent: '#10b981',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles for Controls only -->
    <style>
        /* Maintain controls visibility/layout */
        .slide-controls {
            background: #1e293b;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 50;
        }

        .slide-container {
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            /* brand-dark */
            overflow: hidden;
            position: relative;
        }

        #slide-content {
            height: 100%;
            /* Full height minus controls adjustment if needed */
            width: 100%;
        }

        /* Buttons adaptation */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            background: #334155;
            color: white;
            border: 1px solid #475569;
        }

        .btn:hover {
            background: #3b82f6;
        }

        /* brand-primary */

        /* QR Code fix */
        #qrcode-large img {
            border: 4px solid white;
            border-radius: 4px;
        }
    </style>

    <!-- QR & Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js?v=V2"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js?v=V2"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js?v=V2"></script>
    <script src="js/firebase-config.js?v=V2"></script>
</head>

<body>
    <div class="slide-container">
        <!-- Header eliminado como se solicitó -->

        <main id="slide-content" class="slide-content">
            <!-- Dynamic Content Here -->
            <h1 id="question-text">Esperando participantes...</h1>
            <div id="results-area" class="results-area">
                <!-- Live Results -->
            </div>
        </main>

        <footer class="slide-controls">
            <button class="btn" onclick="prevSlide()">❮ Anterior</button>
            <span id="slide-indicator">Diapositiva 1 / 10</span>
            <button class="btn" onclick="nextSlide()">Siguiente ❯</button>
            <button class="btn"
                style="background-color: #dc3545; font-size: 0.9rem; padding: 0.5rem 1rem; margin-left: 1rem;"
                onclick="fullSessionReset()">♻️ Reiniciar Todo</button>
            <button class="btn"
                style="background-color: #28a745; font-size: 0.9rem; padding: 0.5rem 1rem; margin-left: 1rem;"
                onclick="exportReport()">📄 Exportar Evidencia</button>
            <div class="admin-controls">
                <button onclick="resetVotes()" class="btn btn-danger" style="background: #ef4444;">Reiniciar
                    Votos</button>
            </div>
        </footer>
    </div>

    <!-- Cargar Data Específica -->
    <script src="js/data-cultura2.js?v=V1"></script>

    <!-- Configuración y Carga de Lógica -->
    <script>
        // Configuración para Clase 2
        window.CUSTOM_SESSION_CODE = 'CULTURA-II';

        // URL del participante para esta clase específica
        // NOTA: Ajusta el dominio si cambia
        window.CUSTOM_PARTICIPANT_URL = 'https://68sfszbqhq-stack.github.io/PRESENTACION-TALLER-IA-/participante-c2.html';

        // Mapear los datos nuevos a la variable que espera el motor antiguo
        const presentationData = presentationDataCultura2;
    </script>

    <script src="js/presentador.js?v=V2"></script>
</body>

</html>
