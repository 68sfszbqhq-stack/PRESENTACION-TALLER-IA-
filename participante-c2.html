<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Participante - Cultura Digital II</title>

    <!-- Using same CSS but with Theme Override -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cultura2.css">

    <!-- QR Code & Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>

<body>
    <div class="container" style="max-width: 500px; padding: 1rem;">

        <!-- PANTALLA 1: LOGIN -->
        <div id="login-screen">
            <h1>Bienvenido / Welcome</h1>
            <p>Ingresa tu nombre para unirte a la sesión:</p>
            <input type="text" id="username" class="input-field" placeholder="Tu Nombre Completo"
                style="width: 100%; padding: 15px; font-size: 1.1rem; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px;">
            <button onclick="joinSession()" class="btn btn-primary" style="width: 100%;">
                Comenzar 🚀
            </button>
        </div>

        <!-- PANTALLA 2: ESPERA -->
        <div id="waiting-screen" style="display: none; text-align: center;">
            <div class="pulse-ring"></div>
            <h2>¡Hola <span id="display-name" style="color: var(--primary-color);"></span>!</h2>
            <p style="font-size: 1.2rem; margin-top: 20px;">Estás conectado.</p>
            <p style="color: #666;">Espera a que el profesor avance la diapositiva...</p>
            <img src="https://media.giphy.com/media/xTk9ZvMnbIiIew7IpW/giphy.gif" alt="Waiting"
                style="width: 150px; border-radius: 10px; margin-top: 20px;">

            <!-- Compartir Container -->
            <div id="share-container" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
                <p style="font-size: 0.9rem;">Invita a un compañero:</p>
                <div id="share-qr" style="display: inline-block;"></div>
            </div>
        </div>

        <!-- PANTALLA 3: INTERACCIÓN -->
        <div id="interaction-screen" style="display: none;">
            <h2 id="current-question" style="font-size: 1.4rem; color: var(--primary-color); margin-bottom: 20px;"></h2>
            <div id="interaction-area">
                <!-- Data will be injected here -->
            </div>
        </div>

    </div>

    <!-- Cargar Datos de Clase 2 -->
    <script src="js/data-cultura2.js?v=V1"></script>

    <!-- Configuración y Lógica -->
    <script>
        // Mapear datos a variable global esperada
        window.presentationData = presentationDataCultura2;
        var presentationData = presentationDataCultura2; // Fallback seguro

        // Configuración opcional para sesión por defecto si no viene en URL
        window.DEFAULT_SESSION_CODE = 'CULTURA-II';
    </script>

    <script src="js/participante.js?v=V2"></script>
</body>

</html>
