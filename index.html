<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación Interactiva</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container landing-container">
        <h1>Bienvenido a la Presentación Interactiva</h1>
        <p>Selecciona tu rol para continuar:</p>

        <div class="role-selection" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Opción 1: Taller IA -->
            <a href="#" onclick="accessPresentation(event, 'presentador.html')" class="btn btn-primary"
                style="background-color: #9D2449;">
                <span class="icon">🎓</span>
                Taller IA Docente
            </a>

            <!-- Opción 2: Cultura Digital -->
            <a href="#" onclick="accessPresentation(event, 'presentador-c2.html')" class="btn btn-primary"
                style="background-color: #2e86c1;">
                <span class="icon">💻</span>
                Cultura Digital II
            </a>

            <!-- Opción 3: Participante -->
            <a href="participante.html" class="btn btn-secondary">
                <span class="icon">📱</span>
                Soy un Participante
            </a>
        </div>


        <script>
            function accessPresentation(event, url) {
                event.preventDefault();
                const password = prompt("Por favor, ingrese la contraseña de acceso:");
                if (password === "2019") {
                    window.location.href = url;
                } else if (password !== null) {
                    alert("Contraseña incorrecta.");
                }
            }
        </script>

        <div style="margin-top: 2rem; border-top: 1px solid #ddd; padding-top: 1rem;">
            <p style="font-size: 0.9rem; color: #666;">¿Problemas técnicos?</p>
            <a href="offline.html" class="btn" style="background: #6b7280; color: white;">
                <span class="icon">⚠️</span>
                Modo Offline (Solo Presentación)
            </a>
        </div>
    </div>
</body>

</html>
